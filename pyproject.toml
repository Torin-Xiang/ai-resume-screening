[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-screening"
version = "0.1.0"
description = "AI 简历初筛 MVP：PDF 解析 → 结构化提取 → 评分卡 → 双层评估 → Excel 导出与复核"
requires-python = ">=3.13"
dependencies = [
    "pymupdf>=1.25",
    "pydantic>=2.7",
    "typer>=0.12",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10"]

[project.scripts]
resume-screen = "resume_screening.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
# 保留 pytest 临时目录，避免自动清理旧的临时文件（本机 temp 目录批量删除有风险）
tmp_path_retention_count = 10000
tmp_path_retention_policy = "all"
